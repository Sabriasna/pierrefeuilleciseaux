<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pierre Feuille Ciseaux</title>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="musique" src="retro.mp3" autoplay loop></audio>

  <h1>Pierre - Feuille - Ciseaux</h1>

<div class="choices">
  <button onclick="jouer('pierre')">Pierre</button>
  <button onclick="jouer('feuille')">Feuille</button>
  <button onclick="jouer('ciseaux')">Ciseaux</button>
  <button onclick="stopInfini()" id="stop" style="display:none;">Arrêter</button>
</div>

  <div class="infos">
    <p id="manche">Manche : 1 / 3</p>
    <p id="resultat"></p>
    <p id="choix"></p>
    <p id="score">Score : Toi 0 - 0 Ordi</p>
    <p id="fin"></p>
    <button id="rejouer" onclick="reinitialiser()" style="display:none;">Rejouer</button>
    
<div class="progression">
  <progress id="barre" value="1" max="100"></progress>
</div>

  <script src="script.js"></script>
</body>
</html>
